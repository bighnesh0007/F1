services:
  server:
    build: ./server
    container_name: f1-server
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  client:
    build: ./client
    container_name: f1-client
    environment:
      # Server-to-server calls go over the internal Docker network.
      SERVER_URL: http://server:4000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
